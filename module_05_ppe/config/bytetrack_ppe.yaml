# ByteTrack settings passed to ultralytics (model.track(tracker=...)).
# NOT yet exercised in this environment (ultralytics not installed here).
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25
track_buffer: 30        # frames a lost track is kept (matches tracking.max_age)
match_thresh: 0.80
fuse_score: true
